
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Programming</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: #f2f2f2;
        }

        button {
            padding: 12px 25px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <h1>Asynchronous Programming</h1>

    <button onclick="fetchData()">Fetch Server Data</button>

    <div id="result"></div>

    <script>

        function getData() {

            return new Promise((resolve, reject) => {

                setTimeout(() => {

                    let data = {
                        id: 12515000047,
                        name: "Abhishek Agarwal",
                        course: "Computer Science"
                    };

                    resolve(data);

                }, 3000);

            });
        }

        function fetchData() {

            document.getElementById("result").innerHTML =
                "Loading data... Please wait.";

            getData()
                .then((data) => {

                    document.getElementById("result").innerHTML =
                        "Data Received Successfully!<br><br>" +
                        "ID: " + data.id + "<br>" +
                        "Name: " + data.name + "<br>" +
                        "Course: " + data.course;

                })
                .catch((error) => {

                    document.getElementById("result").innerHTML =
                        "Error: " + error;

                });

        }

    </script>

</body>
</html>
