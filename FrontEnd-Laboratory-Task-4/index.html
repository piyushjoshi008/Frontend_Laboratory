<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ocean Explorer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #001f3f;">
        <div class="container">
            <a class="navbar-brand" href="#">
                🌊 Ocean Explorer
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#home">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#discoveries">Discoveries</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <section id="home" class="hero">
        <div class="container">
            <div class="row align-items-center">

                <div class="col-md-6 text-center text-md-start">
                    <h1>Dive Into The Deep</h1>
                    <p>
                        Discover coral reefs, lost shipwrecks, and mysterious
                        creatures living in the deep blue.
                    </p>
                    <button class="btn btn-info btn-lg text-white">
                        Start Diving
                    </button>
                </div>
                <div class="col-md-6 text-center">
                    <div class="ocean-area">
                        <div class="fish">
                            🐠
                        </div>
                        <div class="diver">
                            🤿
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</html>
