
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Finder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            background-color: white;
            max-width: 700px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
        }

        input {
            padding: 12px;
            width: 55%;
            border: 1px solid gray;
            border-radius: 5px;
        }

        button {
            padding: 12px 20px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .university {
            background-color: whitesmoke;
            margin: 12px 0;
            padding: 15px;
            border-radius: 5px;
            text-align: left;
        }

        a {
            color: blue;
            word-break: break-all;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>University Finder</h1>

        <p>Enter Country Name to Find Universities</p>

        <input type="text" id="country" placeholder="Enter country name">

        <button onclick="getUniversities()">Search</button>

        <div id="result"></div>

    </div>

    <script>

    async function getUniversities() {

    let country = document.getElementById("country").value.trim();
    let result = document.getElementById("result");

    if (country === "") {
        result.innerHTML = "Please enter country name.";
        return;
    }

    result.innerHTML = "Loading...";

    try {

        let response = await fetch(
            "http://universities.hipolabs.com/search?country=" +
            encodeURIComponent(country)
        );

        if (!response.ok) {
            throw new Error("API Error: " + response.status);
        }

        let data = await response.json();

        result.innerHTML = "";

        if (data.length === 0) {
            result.innerHTML = "No universities found!";
            return;
        }

        let heading = document.createElement("h2");
        heading.textContent = "Universities Found: " + data.length;
        result.appendChild(heading);

        data.forEach(function(uni) {

            let div = document.createElement("div");
            div.className = "university";

            let name = document.createElement("h3");
            name.textContent = uni.name;

            let website = document.createElement("a");
            website.textContent = uni.web_pages[0] || "Website not available";

            if (uni.web_pages.length > 0) {
                website.href = uni.web_pages[0];
                website.target = "_blank";
                website.rel = "noopener noreferrer";
            }

                div.appendChild(name);
                div.appendChild(website);

                result.appendChild(div);

            });

        }
        catch (error) {

        result.innerHTML = "Unable to fetch data. " + error.message;
        console.log(error);

        }
    }
     
    </script>

</body>
</html>
